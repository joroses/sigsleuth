[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigsleuth"
version = "0.1.0"
description = "Record and explore Meshtastic network history"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=46,<47",
    "fastapi>=0.116,<1",
    "meshtastic>=2.7.11,<2.8",
    "networkx>=3.7,<4",
    "paho-mqtt>=2.1,<3",
    "pillow>=11,<13",
    "protobuf>=6.33,<7",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "amqtt>=0.11.3,<0.12",
  "filelock>=4.1.1,<5",
  "httpx>=0.28,<1",
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<9",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.13.2,<0.14",
  "types-networkx>=3.6,<4",
  "types-protobuf>=6.32,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend/sigsleuth"]

[tool.mypy]
strict = true
files = ["src/backend", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src/backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src/backend", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
